<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Bar charts comparing VEDJE's accuracy gain and cache size reduction, plus a flow diagram of its offline encode-once, reusable-cache pipeline.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
<path d="M0,0 L10,5 L0,10 z" fill="#ff6b01"/>
</marker>
</defs>


<rect x="60" y="70" width="520" height="280" rx="16" fill="#343f60"/>
<text x="320" y="105" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Text-to-Video R@1</text>

<rect x="160" y="160" width="90" height="130" fill="#9aa4bf"/>
<text x="205" y="150" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">56.2</text>
<text x="205" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Baseline</text>

<rect x="310" y="150" width="90" height="140" fill="#ff6b01"/>
<text x="355" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">59.8</text>
<text x="355" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">VEDJE</text>

<line x1="100" y1="290" x2="540" y2="290" stroke="#9aa4bf" stroke-width="2"/>


<rect x="620" y="70" width="520" height="280" rx="16" fill="#343f60"/>
<text x="880" y="105" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Cache Size</text>

<rect x="720" y="140" width="90" height="150" fill="#9aa4bf"/>
<text x="765" y="130" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">4x</text>
<text x="765" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Before</text>

<rect x="870" y="252" width="90" height="38" fill="#ff6b01"/>
<text x="915" y="242" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">12 KiB</text>
<text x="915" y="316" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">VEDJE</text>

<line x1="660" y1="290" x2="1100" y2="290" stroke="#9aa4bf" stroke-width="2"/>
<text x="880" y="340" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">&lt;0.2 pt R@1 loss</text>


<rect x="130" y="430" width="220" height="100" rx="12" fill="#343f60"/>
<text x="240" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Video</text>

<rect x="370" y="430" width="220" height="100" rx="12" fill="#343f60"/>
<text x="480" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Encode once</text>

<rect x="610" y="430" width="220" height="100" rx="12" fill="#343f60"/>
<text x="720" y="485" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">12 KiB cache</text>

<rect x="850" y="430" width="220" height="100" rx="12" fill="#343f60"/>
<text x="960" y="475" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Cross-encoder</text>
<text x="960" y="500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#ff6b01" text-anchor="middle">(33M)</text>

<line x1="350" y1="480" x2="365" y2="480" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="590" y1="480" x2="605" y2="480" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="830" y1="480" x2="845" y2="480" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>

<text x="600" y="560" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Reused every query</text>
</svg>