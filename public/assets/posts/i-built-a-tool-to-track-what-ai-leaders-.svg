<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>A four-stage pipeline diagram showing how the tool ingests, transcribes, extracts, and diffs claims from AI leaders, feeding into three possible diff outcomes.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

<text x="600" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">From scattered commentary to a structured, diffable timeline</text>


<rect x="60" y="110" width="230" height="140" rx="12" fill="#343f60"/>
<text x="175" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Ingest</text>
<text x="175" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">yt-dlp</text>

<rect x="343" y="110" width="230" height="140" rx="12" fill="#343f60"/>
<text x="458" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Transcribe</text>
<text x="458" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Whisper</text>
<text x="458" y="228" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">diarized</text>

<rect x="626" y="110" width="230" height="140" rx="12" fill="#343f60"/>
<text x="741" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Extract</text>
<text x="741" y="188" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Claims</text>
<text x="741" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">via LLM</text>

<rect x="909" y="110" width="230" height="140" rx="12" fill="#343f60"/>
<text x="1024" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Diff</text>
<text x="1024" y="188" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">&amp; Flag</text>
<text x="1024" y="222" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#ff6b01" text-anchor="middle">cosine ≥0.82</text>


<polygon points="300,180 320,170 300,160" fill="#ff6b01"/>
<polygon points="583,180 603,170 583,160" fill="#ff6b01"/>
<polygon points="866,180 886,170 866,160" fill="#ff6b01"/>


<line x1="1024" y1="250" x2="1024" y2="280" stroke="#ff6b01" stroke-width="3"/>
<polygon points="1012,278 1024,298 1036,278" fill="#ff6b01"/>


<rect x="60" y="300" width="1080" height="260" rx="16" fill="#343f60"/>
<text x="600" y="340" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle" font-weight="bold">Diff Result Labels</text>
<text x="600" y="368" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">similarity threshold ≥ 0.82</text>

<rect x="100" y="400" width="280" height="90" rx="12" fill="#212737" stroke="#9aa4bf" stroke-width="2"/>
<text x="240" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Consistent</text>

<rect x="460" y="400" width="280" height="90" rx="12" fill="#212737" stroke="#ff6b01" stroke-width="2"/>
<text x="600" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Refined</text>

<rect x="820" y="400" width="280" height="90" rx="12" fill="#212737" stroke="#ff6b01" stroke-width="3"/>
<text x="960" y="452" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">Contradicted</text>
</svg>