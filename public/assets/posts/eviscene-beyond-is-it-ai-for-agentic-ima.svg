<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram showing the EviLens benchmark statistics, the EviScene agent's investigation loop, and a bar chart comparing the full agent against the base agent on Balanced Accuracy and Evidence Sufficiency.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>


<rect x="40" y="40" width="540" height="220" rx="16" fill="#343f60"/>
<text x="60" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01">EviLens Benchmark</text>
<rect x="62" y="98" width="12" height="12" fill="#ff6b01"/>
<text x="84" y="109" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">10,174 images</text>
<rect x="62" y="128" width="12" height="12" fill="#9aa4bf"/>
<text x="84" y="139" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">3,114 supported</text>
<rect x="62" y="158" width="12" height="12" fill="#9aa4bf"/>
<text x="84" y="169" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">7,060 refuted</text>
<rect x="62" y="188" width="12" height="12" fill="#ff6b01"/>
<text x="84" y="199" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">12 error types</text>


<rect x="620" y="40" width="540" height="220" rx="16" fill="#343f60"/>
<text x="640" y="78" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01">EviScene Agent Loop</text>

<rect x="640" y="120" width="100" height="50" rx="8" fill="#212737" stroke="#ff6b01" stroke-width="2"/>
<text x="690" y="151" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Inspect</text>

<line x1="745" y1="145" x2="755" y2="145" stroke="#9aa4bf" stroke-width="2"/>
<polygon points="755,139 765,145 755,151" fill="#9aa4bf"/>

<rect x="760" y="120" width="100" height="50" rx="8" fill="#212737" stroke="#ff6b01" stroke-width="2"/>
<text x="810" y="151" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Retrieve</text>

<line x1="865" y1="145" x2="875" y2="145" stroke="#9aa4bf" stroke-width="2"/>
<polygon points="875,139 885,145 875,151" fill="#9aa4bf"/>

<rect x="880" y="120" width="100" height="50" rx="8" fill="#212737" stroke="#ff6b01" stroke-width="2"/>
<text x="930" y="151" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Analyze</text>

<line x1="985" y1="145" x2="995" y2="145" stroke="#9aa4bf" stroke-width="2"/>
<polygon points="995,139 1005,145 995,151" fill="#9aa4bf"/>

<rect x="1000" y="120" width="100" height="50" rx="8" fill="#212737" stroke="#ff6b01" stroke-width="2"/>
<text x="1050" y="151" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Report</text>

<path d="M1050,170 C1050,225 650,225 650,170" fill="none" stroke="#9aa4bf" stroke-width="2"/>
<polygon points="644,170 656,170 650,155" fill="#9aa4bf"/>
<text x="850" y="222" text-anchor="middle" font-family="ui-monospace, Menlo, Consonsolas, monospace" font-size="22" fill="#9aa4bf">Refine</text>


<rect x="40" y="300" width="1120" height="290" rx="16" fill="#343f60"/>
<text x="60" y="338" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01">Full vs Base Agent</text>

<rect x="900" y="315" width="16" height="16" fill="#9aa4bf"/>
<text x="924" y="328" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Base</text>
<rect x="900" y="345" width="16" height="16" fill="#ff6b01"/>
<text x="924" y="358" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Full</text>

<line x1="80" y1="560" x2="1120" y2="560" stroke="#9aa4bf" stroke-width="2"/>

<rect x="300" y="423" width="70" height="137" fill="#9aa4bf"/>
<text x="335" y="413" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">72.34%</text>

<rect x="390" y="410" width="70" height="150" fill="#ff6b01"/>
<text x="425" y="400" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">79.05%</text>

<rect x="760" y="478" width="70" height="82" fill="#9aa4bf"/>
<text x="795" y="468" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">42.89%</text>

<rect x="850" y="461" width="70" height="99" fill="#ff6b01"/>
<text x="885" y="451" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">52.26%</text>

<text x="345" y="582" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">Accuracy</text>
<text x="805" y="582" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">Evidence Sufficiency</text>
</svg>