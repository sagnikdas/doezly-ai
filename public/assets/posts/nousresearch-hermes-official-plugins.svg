<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Flow diagram showing Nous Research maintaining the hermes-official-plugins repo, which bundles Home Assistant, Spotify, and Claude Subscription DirectSDK plugins into Hermes Agent, with 275 GitHub stars.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto">
<path d="M0,0 L10,5 L0,10 z" fill="#9aa4bf"/>
</marker>
</defs>


<rect x="450" y="60" width="300" height="80" rx="12" fill="#343f60"/>
<text x="600" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Nous Research</text>
<text x="600" y="120" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Official Maintainer</text>

<line x1="600" y1="140" x2="600" y2="188" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>


<rect x="350" y="190" width="500" height="100" rx="12" fill="#343f60"/>
<text x="600" y="235" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">hermes-official-plugins</text>
<rect x="470" y="245" width="260" height="34" rx="8" fill="#ff6b01"/>
<text x="600" y="269" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#212737" text-anchor="middle">275 GitHub Stars</text>


<line x1="600" y1="290" x2="240" y2="328" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="290" x2="600" y2="328" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="290" x2="960" y2="328" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>


<rect x="70" y="330" width="340" height="90" rx="12" fill="#343f60"/>
<text x="240" y="382" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Home Assistant</text>

<rect x="430" y="330" width="340" height="90" rx="12" fill="#343f60"/>
<text x="600" y="382" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Spotify</text>

<rect x="790" y="330" width="340" height="90" rx="12" fill="#343f60"/>
<text x="960" y="368" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Claude Subscription</text>
<text x="960" y="396" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">DirectSDK</text>

<text x="600" y="455" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">+ more plugins</text>


<line x1="240" y1="420" x2="600" y2="468" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="600" y1="420" x2="600" y2="468" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="960" y1="420" x2="600" y2="468" stroke="#9aa4bf" stroke-width="2" marker-end="url(#arrow)"/>


<rect x="350" y="470" width="500" height="90" rx="12" fill="#343f60"/>
<text x="600" y="524" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01" text-anchor="middle">Hermes Agent</text>

</svg>