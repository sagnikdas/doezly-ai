<text x="940" y="428" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#eaedf3" text-anchor="middle">Technical</text>

<rect x="60" y="520" width="540" height="70" rx="12" fill="#343f60"/>
