<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Comparison of manual versus AI video game decompiling speed, with a framerate jump example from the IsaacRecomp project.</title>
<rect x="0" y="0" width="1200" height="630" fill="#212737" rx="24"/>


<rect x="40" y="60" width="520" height="200" fill="#343f60" rx="16"/>
<text x="70" y="115" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="36" fill="#ff6b01">Manual</text>
<text x="70" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3">Years of work</text>
<text x="70" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">OpenGOAL and Harkinian</text>


<rect x="640" y="60" width="520" height="200" fill="#343f60" rx="16"/>
<text x="670" y="115" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="36" fill="#ff6b01">AI</text>
<text x="670" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3">Days · Hundreds of projects</text>
<text x="670" y="200" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">IsaacRecomp</text>


<line x1="600" y1="160" x2="640" y2="160" stroke="#ff6b01" stroke-width="4"/>
<polygon points="640,152 656,160 640,168" fill="#ff6b01"/>


<line x1="400" y1="520" x2="800" y2="520" stroke="#9aa4bf" stroke-width="2"/>


<rect x="440" y="487" width="100" height="33" fill="#343f60"/>
<text x="490" y="470" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">30 FPS</text>


<rect x="660" y="340" width="100" height="180" fill="#ff6b01"/>
<text x="710" y="325" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">165 FPS</text>
<text x="710" y="555" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">1440p</text>


<text x="600" y="560" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Risk: faster decompiling threatens licensing and ownership.</text>
<text x="600" y="586" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">AnyPS5 could port console games to PC.</text>
</svg>