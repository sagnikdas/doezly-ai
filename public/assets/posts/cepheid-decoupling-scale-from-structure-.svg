<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram showing Cepheid's single model turning 6–10 tracked points into dense mesh motion across five geometry families, with a bar chart of error reduction versus the harmonic-extension baseline on unseen cloth and legged robots.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>


<rect x="70" y="120" width="280" height="120" rx="16" fill="#343f60"/>
<text x="210" y="175" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">6–10 points</text>
<text x="210" y="208" font-size="22" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">(0.09–0.5% of mesh)</text>


<line x1="350" y1="180" x2="420" y2="180" stroke="#9aa4bf" stroke-width="3"/>
<polygon points="420,168 442,180 420,192" fill="#9aa4bf"/>


<rect x="460" y="100" width="280" height="160" rx="16" fill="#ff6b01"/>
<text x="600" y="170" font-size="28" fill="#212737" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle" font-weight="bold">Cepheid</text>
<text x="600" y="205" font-size="22" fill="#212737" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">unified model</text>


<line x1="740" y1="180" x2="810" y2="180" stroke="#9aa4bf" stroke-width="3"/>
<polygon points="810,168 832,180 810,192" fill="#9aa4bf"/>


<rect x="850" y="120" width="280" height="120" rx="16" fill="#343f60"/>
<text x="990" y="175" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Dense motion</text>
<text x="990" y="208" font-size="22" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">for every vertex</text>


<line x1="600" y1="260" x2="180" y2="300" stroke="#9aa4bf" stroke-width="2"/>
<line x1="600" y1="260" x2="390" y2="300" stroke="#9aa4bf" stroke-width="2"/>
<line x1="600" y1="260" x2="600" y2="300" stroke="#9aa4bf" stroke-width="2"/>
<line x1="600" y1="260" x2="810" y2="300" stroke="#9aa4bf" stroke-width="2"/>
<line x1="600" y1="260" x2="1020" y2="300" stroke="#9aa4bf" stroke-width="2"/>


<rect x="110" y="300" width="140" height="50" rx="12" fill="#343f60"/>
<text x="180" y="332" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Animals</text>

<rect x="320" y="300" width="140" height="50" rx="12" fill="#343f60"/>
<text x="390" y="332" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Humans</text>

<rect x="530" y="300" width="140" height="50" rx="12" fill="#343f60"/>
<text x="600" y="332" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Robots</text>

<rect x="740" y="300" width="140" height="50" rx="12" fill="#343f60"/>
<text x="810" y="332" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Cloth</text>

<rect x="950" y="300" width="140" height="50" rx="12" fill="#343f60"/>
<text x="1020" y="332" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Video</text>


<text x="600" y="400" font-size="24" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Error reduction vs harmonic baseline</text>

<line x1="150" y1="450" x2="1050" y2="450" stroke="#9aa4bf" stroke-width="2" stroke-dasharray="6,6"/>
<text x="150" y="440" font-size="22" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="start">Baseline: 0%</text>

<rect x="430" y="450" width="120" height="96" fill="#ff6b01"/>
<text x="490" y="571" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Cloth -15.6%</text>

<rect x="650" y="450" width="120" height="61" fill="#ff6b01"/>
<text x="710" y="536" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" text-anchor="middle">Legged robots -10.1%</text>

</svg>