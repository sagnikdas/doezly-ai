<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram comparing fixed-format GUI agent memory with SwitchMem's per-step dynamic text/image routing, showing SwitchMem outperforms static baselines on three benchmarks.</title>
<rect x="0" y="0" width="1200" height="630" fill="#212737" rx="24"/>

<text x="600" y="95" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">T = Text memory&#160;&#160;&#160;&#160;I = Image memory</text>


