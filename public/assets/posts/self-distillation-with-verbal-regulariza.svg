<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram comparing standard self-distillation (OPSD) to VRSD, showing how teacher-only verification prompts curb shortcut reasoning and improve Pass@1 accuracy.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>


<text x="600" y="70" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#ff6b01" text-anchor="middle">VRSD vs Standard OPSD</text>


<rect x="60" y="110" width="500" height="310" rx="16" fill="#343f60"/>
<text x="310" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Standard OPSD</text>

<rect x="80" y="160" width="460" height="50" rx="10" fill="#212737"/>
<text x="310" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Teacher sees answer</text>
<line x1="310" y1="210" x2="310" y2="220" stroke="#ff6b01" stroke-width="2"/>
<polygon points="305,220 315,220 310,228" fill="#ff6b01"/>

<rect x="80" y="220" width="460" height="50" rx="10" fill="#212737"/>
<text x="310" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Takes shortcuts</text>
<line x1="310" y1="270" x2="310" y2="280" stroke="#ff6b01" stroke-width="2"/>
<polygon points="305,280 315,280 310,288" fill="#ff6b01"/>

<rect x="80" y="280" width="460" height="50" rx="10" fill="#212737"/>
<text x="310" y="312" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Entropy collapses</text>
<line x1="310" y1="330" x2="310" y2="340" stroke="#ff6b01" stroke-width="2"/>
<polygon points="305,340 315,340 310,348" fill="#ff6b01"/>

<rect x="80" y="340" width="460" height="50" rx="10" fill="#212737"/>
<text x="310" y="372" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Student copies shortcuts</text>


<rect x="640" y="110" width="500" height="310" rx="16" fill="#343f60" stroke="#ff6b01" stroke-width="2"/>
<text x="890" y="140" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">VRSD</text>

<rect x="660" y="160" width="460" height="50" rx="10" fill="#212737"/>
<text x="890" y="192" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Teacher sees answer</text>
<line x1="890" y1="210" x2="890" y2="220" stroke="#ff6b01" stroke-width="2"/>
<polygon points="885,220 895,220 890,228" fill="#ff6b01"/>

<rect x="660" y="220" width="460" height="50" rx="10" fill="#212737"/>
<text x="890" y="252" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">+ verify prompt</text>
<line x1="890" y1="270" x2="890" y2="280" stroke="#ff6b01" stroke-width="2"/>
<polygon points="885,280 895,280 890,288" fill="#ff6b01"/>

<rect x="660" y="280" width="460" height="50" rx="10" fill="#212737"/>
<text x="890" y="312" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Entropy stays higher</text>
<line x1="890" y1="330" x2="890" y2="340" stroke="#ff6b01" stroke-width="2"/>
<polygon points="885,340 895,340 890,348" fill="#ff6b01"/>

<rect x="660" y="340" width="460" height="50" rx="10" fill="#212737"/>
<text x="890" y="372" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Student reasons faithfully</text>


<rect x="40" y="450" width="360" height="140" rx="16" fill="#343f60"/>
<text x="220" y="510" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" fill="#ff6b01" text-anchor="middle">+3.9 pp</text>
<text x="220" y="550" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">avg Pass@1 gain</text>

<rect x="420" y="450" width="360" height="140" rx="16" fill="#343f60"/>
<text x="600" y="510" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" fill="#ff6b01" text-anchor="middle">11 / 12</text>
<text x="600" y="550" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">settings improved</text>

<rect x="800" y="450" width="360" height="140" rx="16" fill="#343f60"/>
<text x="980" y="510" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="34" fill="#ff6b01" text-anchor="middle">3 × 4</text>
<text x="980" y="550" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">models × tasks tested</text>
</svg>