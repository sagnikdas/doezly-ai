<text x="210" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">vendored generic rules</text>

<polygon points="365,140 400,150 365,160" fill="#ff6b01"/>
<line x1="360" y1="150" x2="400" y2="150" stroke="#ff6b01" stroke-width="4"/>

