<text x="990" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Runs on Oxlint</text>
<text x="990" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">Bun · Deno · Node</text>


<text x="600" y="265" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#9aa4bf" text-anchor="middle">Example rule catches</text>


<rect x="60" y="290" width="300" height="140" rx="12" fill="#343f60"/>
<text x="210" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Fabricated `as`</text>
