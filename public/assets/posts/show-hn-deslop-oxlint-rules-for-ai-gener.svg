<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Flow diagram showing Deslop vendoring rules from anti-slop, adding new checks, and running on Oxlint, with example rule catches and Hacker News reception stats.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>


<rect x="60" y="70" width="300" height="160" rx="12" fill="#343f60"/>
