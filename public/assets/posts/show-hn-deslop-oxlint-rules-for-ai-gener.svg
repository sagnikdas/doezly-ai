<text x="600" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">blocked (type-aware)</text>

<rect x="840" y="290" width="300" height="140" rx="12" fill="#343f60"/>
<text x="990" y="350" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Always truthy/falsy</text>
<text x="990" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">conditions disallowed</text>


