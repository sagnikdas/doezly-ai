<text x="600" y="135" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">Deslop deslop/*</text>
<text x="600" y="170" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf" text-anchor="middle">adds new rules</text>

<polygon points="755,140 790,150 755,160" fill="#ff6b01"/>
<line x1="750" y1="150" x2="790" y2="150" stroke="#ff6b01" stroke-width="4"/>

