<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Comparison diagram showing a manual workflow versus an AI-assisted workflow with fewer steps</title>
<rect width="1200" height="630" fill="#212737" rx="24"/>

<text x="600" y="80" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="30" text-anchor="middle" font-weight="bold">Manual Process vs. AI-Assisted Process</text>


<text x="100" y="150" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">Manual</text>
<rect x="100" y="180" width="180" height="90" rx="12" fill="#343f60"/>
<text x="190" y="232" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Collect</text>

<rect x="330" y="180" width="180" height="90" rx="12" fill="#343f60"/>
<text x="420" y="232" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Review</text>

<rect x="560" y="180" width="180" height="90" rx="12" fill="#343f60"/>
<text x="650" y="232" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Decide</text>

<rect x="790" y="180" width="180" height="90" rx="12" fill="#343f60"/>
<text x="880" y="232" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Act</text>

<line x1="280" y1="225" x2="330" y2="225" stroke="#9aa4bf" stroke-width="3"/>
<line x1="510" y1="225" x2="560" y2="225" stroke="#9aa4bf" stroke-width="3"/>
<line x1="740" y1="225" x2="790" y2="225" stroke="#9aa4bf" stroke-width="3"/>


<text x="100" y="360" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24">AI-Assisted</text>
<rect x="100" y="390" width="280" height="90" rx="12" fill="#ff6b01"/>
<text x="240" y="442" fill="#212737" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Collect + Review</text>

<rect x="430" y="390" width="280" height="90" rx="12" fill="#ff6b01"/>
<text x="570" y="442" fill="#212737" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Decide + Act</text>

<line x1="380" y1="435" x2="430" y2="435" stroke="#eaedf3" stroke-width="3"/>

<text x="600" y="560" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">AI merges steps, cutting the workflow in half.</text>
</svg>