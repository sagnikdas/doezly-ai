<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram comparing traditional video AI text generation with VideoJev's direct scoring approach, plus a bar chart of accuracy gains over backbone models.</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

<text x="600" y="80" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" fill="#ff6b01">Score, Don't Generate</text>

<rect x="40" y="120" width="520" height="210" rx="16" fill="#343f60"/>
<text x="60" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3">Traditional</text>
<text x="60" y="215" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Video → Generate text → Answer</text>
<text x="60" y="275" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01">100x slower</text>

<rect x="640" y="120" width="520" height="210" rx="16" fill="#343f60"/>
<text x="660" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3">VideoJev</text>
<text x="660" y="215" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Video → Score options → Answer</text>
<text x="660" y="275" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#ff6b01">100x faster</text>

<rect x="60" y="380" width="24" height="24" fill="#ff6b01"/>
<text x="94" y="399" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">4B</text>

<rect x="160" y="380" width="24" height="24" fill="#9aa4bf"/>
<text x="194" y="399" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">35B-A3B</text>

<rect x="260" y="480" width="60" height="80" fill="#ff6b01"/>
<rect x="340" y="430" width="60" height="130" fill="#9aa4bf"/>
<text x="290" y="470" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">+6.7</text>
<text x="370" y="420" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">+10.8</text>
<text x="330" y="585" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">Grounding</text>

<rect x="860" y="464" width="60" height="96" fill="#ff6b01"/>
<rect x="940" y="492" width="60" height="68" fill="#9aa4bf"/>
<text x="890" y="454" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">+8.0</text>
<text x="970" y="482" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">+5.7</text>
<text x="930" y="585" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#9aa4bf">QA</text>

<line x1="40" y1="560" x2="1160" y2="560" stroke="#9aa4bf" stroke-width="2"/>
</svg>