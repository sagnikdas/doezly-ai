<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram showing five frontier-lab AI incidents funneling into "unauthorized access," then contrasting labs' claimed cause (AI misalignment) with experts' actual findings (missing sandboxing, weak egress control, no monitoring).</title>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

<text x="600" y="78" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="28" font-weight="bold" fill="#eaedf3">Not Rogue AI — Basic Security Failures</text>


<g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">
<rect x="40" y="120" width="208" height="60" rx="12" fill="#343f60"/>
<text x="144" y="157" text-anchor="middle">OpenAI</text>

<rect x="268" y="120" width="208" height="60" rx="12" fill="#343f60"/>
<text x="372" y="157" text-anchor="middle">Anthropic</text>

<rect x="496" y="120" width="208" height="60" rx="12" fill="#343f60"/>
<text x="600" y="157" text-anchor="middle">Meta</text>

<rect x="724" y="120" width="208" height="60" rx="12" fill="#343f60"/>
<text x="828" y="157" text-anchor="middle">Google</text>

<rect x="952" y="120" width="208" height="60" rx="12" fill="#343f60"/>
<text x="1056" y="157" text-anchor="middle">Mistral</text>
</g>


<g stroke="#9aa4bf" stroke-width="2" fill="none">
<line x1="144" y1="180" x2="600" y2="210"/>
<line x1="372" y1="180" x2="600" y2="210"/>
<line x1="600" y1="180" x2="600" y2="210"/>
<line x1="828" y1="180" x2="600" y2="210"/>
<line x1="1056" y1="180" x2="600" y2="210"/>
</g>


<rect x="400" y="210" width="400" height="56" rx="14" fill="#343f60" stroke="#ff6b01" stroke-width="2"/>
<text x="600" y="246" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#ff6b01">Unauthorized Access</text>

<text x="600" y="292" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" font-style="italic" fill="#9aa4bf">Hugging Face breach: unnoticed for days</text>


<rect x="80" y="320" width="500" height="240" rx="16" fill="#343f60"/>
<text x="330" y="365" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#9aa4bf">Claimed Cause</text>
<circle cx="130" cy="440" r="7" fill="#9aa4bf"/>
<text x="150" y="448" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">AI Misalignment</text>


<text x="600" y="450" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#ff6b01">VS</text>


<rect x="620" y="320" width="500" height="240" rx="16" fill="#343f60" stroke="#ff6b01" stroke-width="3"/>
<text x="870" y="365" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" font-weight="bold" fill="#ff6b01">Actual Cause</text>

<circle cx="670" cy="410" r="7" fill="#ff6b01"/>
<text x="690" y="418" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">No Sandboxing</text>

<circle cx="670" cy="460" r="7" fill="#ff6b01"/>
<text x="690" y="468" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">Weak Egress Control</text>

<circle cx="670" cy="510" r="7" fill="#ff6b01"/>
<text x="690" y="518" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3">No Monitoring</text>

</svg>