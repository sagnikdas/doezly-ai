<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <title>Flow diagram showing banks underwriting AI data center debt, hitting exposure limits, and shopping risk transfers, with the stuck $38B Oracle loan and supporting bond demand and CDS charts.</title>
  <rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>

  
  <rect x="60" y="90" width="300" height="100" rx="12" fill="#343f60"/>
  <text x="210" y="130" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Banks underwrite</text>
  <text x="210" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">AI data center loans</text>

  <polygon points="365,140 395,130 395,150" fill="#9aa4bf"/>

  <rect x="400" y="90" width="300" height="100" rx="12" fill="#343f60"/>
  <text x="550" y="130" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">Hit internal</text>
  <text x="550" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#eaedf3" text-anchor="middle">exposure limits</text>

  <polygon points="705,140 735,130 735,150" fill="#9aa4bf"/>

  <rect x="740" y="90" width="300" height="100" rx="12" fill="#343f60" stroke="#ff6b01" stroke-width="3"/>
  <text x="890" y="130" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">Shop risk transfers</text>
  <text x="890" y="160" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#ff6b01" text-anchor="middle">to outside investors</text>

  
  <rect x="60" y="230" width="1080" height="80" rx="12" fill="#343f60" stroke="#ff6b01" stroke-width="3"/>
  <text x="600" y="280" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" fill="#eaedf3" text-anchor="middle">$38B Oracle-linked construction loan stuck 6+ months</text>

  
  <text x="300" y="365" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#9aa4bf" text-anchor="middle">Bond order book demand</text>

  <line x1="120" y1="550" x2="520" y2="550" stroke="#9aa4bf" stroke-width="2"/>

  <rect x="150" y="400" width="80" height="150" fill="#ff6b01"/>
  <text x="190" y="580" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">Feb: 5x</text>

  <rect x="350" y="496" width="80" height="54" fill="#343f60"/>
  <text x="390" y="580" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">July: &lt;2x</text>

  
  <text x="860" y="365" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" fill="#9aa4bf" text-anchor="middle">Oracle 5-yr CDS</text>

  <line x1="700" y1="450" x2="1000" y2="400" stroke="#ff6b01" stroke-width="3"/>
  <circle cx="700" cy="450" r="10" fill="#ff6b01"/>
  <circle cx="1000" cy="400" r="10" fill="#ff6b01"/>

  <text x="700" y="500" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">151 bps</text>
  <text x="1000" y="380" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#eaedf3" text-anchor="middle">203 bps</text>
</svg>