<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
<title>Diagram showing an LLM/RL agent connected through an AI harness (state serialization, action whitelist, deterministic reset, outcome logging) to the game engine, reducing manual QA by up to 70%.</title>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
<path d="M0,0 L8,4 L0,8 Z" fill="#ff6b01"/>
</marker>
</defs>
<rect x="0" y="0" width="1200" height="630" rx="24" fill="#212737"/>


<rect x="60" y="200" width="240" height="180" rx="12" fill="#343f60"/>
<text x="180" y="300" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">LLM / RL</text>
<text x="180" y="330" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">Agent</text>


<rect x="420" y="100" width="360" height="380" rx="12" fill="#343f60"/>
<text x="600" y="150" fill="#ff6b01" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="26" text-anchor="middle">AI Harness</text>

<rect x="440" y="170" width="320" height="60" rx="8" fill="#212737"/>
<text x="600" y="207" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Serialize State</text>

<rect x="440" y="240" width="320" height="60" rx="8" fill="#212737"/>
<text x="600" y="277" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Action Whitelist</text>

<rect x="440" y="310" width="320" height="60" rx="8" fill="#212737"/>
<text x="600" y="347" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Deterministic Reset</text>

<rect x="440" y="380" width="320" height="60" rx="8" fill="#212737"/>
<text x="600" y="417" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">Outcome Logging</text>


<rect x="900" y="200" width="240" height="180" rx="12" fill="#343f60"/>
<text x="1020" y="300" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">Game</text>
<text x="1020" y="330" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">Engine</text>


<line x1="305" y1="240" x2="415" y2="240" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="225" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">action</text>

<line x1="415" y1="340" x2="305" y2="340" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<text x="360" y="365" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">state</text>


<line x1="785" y1="240" x2="895" y2="240" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<text x="840" y="225" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">action</text>

<line x1="895" y1="340" x2="785" y2="340" stroke="#ff6b01" stroke-width="3" marker-end="url(#arrow)"/>
<text x="840" y="365" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" text-anchor="middle">state</text>


<rect x="300" y="520" width="600" height="70" rx="12" fill="#343f60"/>
<text x="600" y="563" fill="#ff6b01" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="24" text-anchor="middle">Cuts manual QA cycles by up to 70%</text>
</svg>