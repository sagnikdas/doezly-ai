<text x="600" y="108" text-anchor="middle" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">Decision</text>
<text x="600" y="136" text-anchor="middle" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">Stack</text>

<rect x="730" y="70" width="200" height="90" rx="12" fill="#343f60"/>
<text x="830" y="108" text-anchor="middle" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">Coverage</text>
<text x="830" y="136" text-anchor="middle" font-size="24" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">Gate</text>

<rect x="960" y="70" width="200" height="90" rx="12" fill="#343f60"/>
<text x="1060" y="122" text-anchor="middle" font-size="24" fill="#ff6b01" font-family="ui-monospace, Menlo, Consolas, monospace">Decision</text>


<line x1="240" y1="115" x2="266" y2="115" stroke="#ff6b01" stroke-width="3"/>
<polygon points="266,108 266,122 276,115" fill="#ff6b01"/>

<line x1="470" y1="115" x2="496" y2="115" stroke="#ff6b01" stroke-width="3"/>
