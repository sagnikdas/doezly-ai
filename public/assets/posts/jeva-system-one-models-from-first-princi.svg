<polygon points="956,108 956,122 966,115" fill="#ff6b01"/>


<text x="40" y="245" font-size="26" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">Latency Speedup</text>

<rect x="120" y="520" width="120" height="20" fill="#ff6b01"/>
<text x="180" y="505" text-anchor="middle" font-size="22" fill="#eaedf3" font-family="ui-monospace, Menlo, Consolas, monospace">2x+</text>
<text x="180" y="565" text-anchor="middle" font-size="22" fill="#9aa4bf" font-family="ui-monospace, Menlo, Consolas, monospace">2,048 Candidates</text>

